<div class="container min-h-screen flex items-center justify-center bg-cover">

  <div class="w-full flex justify-center px-4">

    <!-- SAME SIZE AS LOGIN -->
    <div class="border-2 border-white rounded-3xl overflow-hidden
                flex shadow-2xl w-[900px]">

      <!-- LEFT PANEL -->
      <div class="flex-1 p-6 text-white flex flex-col justify-between">
        <div class="flex justify-between items-center">
          <p class="text-sm font-semibold">Selected Works</p>
          <button (click)="goToLogin()"
            class="px-4 py-1.5 text-sm border border-white rounded-full">
            Login
          </button>
        </div>
        <p>Andrew.us</p>
      </div>

      <!-- RIGHT REGISTER PANEL -->
      <div class="bg-white flex-1 p-8">

        <h2 class="text-2xl font-bold text-center">Register</h2>
        <p class="text-sm text-center text-gray-500">
          Step {{ currentStep }} of 3
        </p>

        <!-- ERROR -->
        <div *ngIf="errorMessage"
             class="mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
          {{ errorMessage }}
        </div>

        <!-- SUCCESS -->
        <div *ngIf="successMessage"
             class="mt-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded">
          {{ successMessage }}
        </div>

        <form class="mt-6 space-y-4">

          <!-- STEP 1 : NAME + CONTACT -->
          <div *ngIf="currentStep === 1" class="space-y-4">
            <input class="input" placeholder="First Name" [(ngModel)]="formData.firstName" name="firstName">
            <input class="input" placeholder="Middle Name" [(ngModel)]="formData.middleName" name="middleName">
            <input class="input" placeholder="Last Name" [(ngModel)]="formData.lastName" name="lastName">
            <input class="input" placeholder="Phone" [(ngModel)]="formData.phone" name="phone">
          </div>
          
          <!-- STEP 2 : EMPLOYEE INFO -->
          <div *ngIf="currentStep === 2" class="grid grid-cols-2 gap-4">
            <input class="input" placeholder="Address" [(ngModel)]="formData.address" name="address">
            <input class="input" placeholder="City" [(ngModel)]="formData.city" name="city">
            <input class="input" placeholder="State" [(ngModel)]="formData.state" name="state">
            <input class="input" placeholder="Country" [(ngModel)]="formData.country" name="country">
            <input class="input" placeholder="Pin Code (6 digits)" [(ngModel)]="formData.pinCode" name="pinCode">
            <input class="input" placeholder="Designation" [(ngModel)]="formData.designation" name="designation">
            <input class="input" placeholder="Employee Type" [(ngModel)]="formData.employeeType" name="employeeType">
            <input class="input" placeholder="PAN Number (10 chars)" [(ngModel)]="formData.panNo" name="panNo">
            <input class="input" placeholder="Aadhar Number (12 digits)" [(ngModel)]="formData.aadharNo" name="aadharNo">
          </div>
          
          <!-- STEP 3 : DATES + LOGIN -->
          <div *ngIf="currentStep === 3" class="space-y-4">
            <input type="date" class="input" [(ngModel)]="formData.joiningDate" name="joiningDate">
            <input type="date" class="input" [(ngModel)]="formData.exitDate" name="exitDate">
            <input class="input" placeholder="Email" [(ngModel)]="formData.email" name="email">
            <input class="input" placeholder="Username" [(ngModel)]="formData.username" name="username">
            <input type="password" class="input" placeholder="Password"
                   [(ngModel)]="formData.password" name="password">
          </div>

        </form>

        <!-- NAVIGATION -->
        <div class="flex justify-between mt-6">
          <button *ngIf="currentStep > 1"
            (click)="prevStep()"
            class="px-4 py-2 bg-gray-300 rounded">
            ← Back
          </button>

          <div class="flex-1"></div>

          <button *ngIf="currentStep < 3"
            (click)="nextStep()"
            class="px-6 py-2 bg-green-600 text-white rounded">
            Next →
          </button>

          <button *ngIf="currentStep === 3"
            (click)="register()"
            class="px-6 py-2 bg-green-600 text-white rounded">
            Register
          </button>
        </div>

        <div class="text-center mt-4">
          <p class="text-sm text-gray-500">
            Already have an account?
            <button (click)="goToLogin()"
                    class="text-green-600 font-semibold">
              Login here
            </button>
          </p>
      </div>
    </div>
  </div>
</div>
