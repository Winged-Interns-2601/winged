<div class="container min-h-screen flex items-center justify-center bg-cover">

  <div class="w-full flex justify-center px-4">

    <!-- SAME SIZE AS LOGIN -->
    <div class="border-2 border-white rounded-3xl overflow-hidden
                flex shadow-2xl w-[900px]">

      <!-- LEFT PANEL -->
      <div class="flex-1 p-6 text-white flex flex-col justify-between">
        <div class="flex justify-between items-center">
          <p class="text-sm font-semibold">Selected Works</p>
          <button (click)="goToLogin()"
            class="px-4 py-1.5 text-sm border border-white rounded-full">
            Login
          </button>
        </div>
        <p>Andrew.us</p>
      </div>

      <!-- RIGHT REGISTER PANEL -->
      <div class="bg-white flex-1 p-8">

        <h2 class="text-2xl font-bold text-center">Register</h2>
        <p class="text-sm text-center text-gray-500">
          Step {{ currentStep }} of 4
        </p>

        <!-- ERROR -->
        <div *ngIf="errorMessage"
             class="mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
          {{ errorMessage }}
        </div>

        <!-- SUCCESS -->
        <div *ngIf="successMessage"
             class="mt-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded">
          {{ successMessage }}
        </div>

        <form (ngSubmit)="register()">
          <!--step1-->
          <div *ngIf="currentStep === 1" class="grid grid-cols-2 gap-3 text-sm">

  <div>
    <label class="label block text-sm font-medium text-gray-600 mb-1">First Name</label>
    <input class="input-sm" [(ngModel)]="formData.firstName" name="firstName">
  </div>

  <div>
    <label class="label block text-sm font-medium text-gray-600 mb-1">Middle Name</label>
    <input class="input-sm" [(ngModel)]="formData.middleName" name="middleName">
  </div>

  <div>
    <label class="label block text-sm font-medium text-gray-600 mb-1">Last Name</label>
    <input class="input-sm" [(ngModel)]="formData.lastName" name="lastName">
  </div>


  
  <div>
    <label class="label block text-sm font-medium text-gray-600 mb-1">Employee Type</label>
    <input class="input-sm" [(ngModel)]="formData.employeeType" name="employeeType">
  </div>
  <div>
    <label class="label block text-sm font-medium text-gray-600 mb-1">Phone</label>
    <input class="input-sm" [(ngModel)]="formData.phone" name="phone">
  </div>

</div>

          
          <!-- STEP 2 : EMPLOYEE INFO -->
          <div *ngIf="currentStep === 2" class="grid grid-cols-3 gap-3 text-sm">

  <div>
    <label class="label block text-sm font-medium text-gray-600 mb-1">Street</label>
    <input class="input-sm" [(ngModel)]="formData.address.street" name="street">
  </div>

  <div>
    <label class="label block text-sm font-medium text-gray-600 mb-1">City</label>
    <input class="input-sm" [(ngModel)]="formData.address.city" name="city">
  </div>

  <div>
    <label class="label block text-sm font-medium text-gray-600 mb-1">State</label>
    <input class="input-sm" [(ngModel)]="formData.address.state" name="state">
  </div>

  <div>
    <label class="label block text-sm font-medium text-gray-600 mb-1">Country</label>
    <input class="input-sm" [(ngModel)]="formData.address.country" name="country">
  </div>

  <div>
    <label class="label block text-sm font-medium text-gray-600 mb-1">Pin Code</label>
    <input class="input-sm" [(ngModel)]="formData.address.pinCode" name="pinCode">
  </div>


  <div>
    <label class="label block text-sm font-medium text-gray-600 mb-1">PAN</label>
    <input class="input-sm" [(ngModel)]="formData.panNo" name="panNo">
  </div>

  <div>
    <label class="label block text-sm font-medium text-gray-600 mb-1">Aadhar</label>
    <input class="input-sm" [(ngModel)]="formData.aadharNo" name="aadharNo">
  </div>

</div>

          
          <!-- STEP 3 : DATES + LOGIN -->
<div *ngIf="currentStep === 3" class="grid grid-cols-2 gap-3 text-sm">

  <div>
    <label class="label block text-sm font-medium text-gray-600 mb-1">Joining Date</label>
    <input type="date" class="input-sm" [(ngModel)]="formData.joiningDate" name="joiningDate">
  </div>

  <div>
    <label class="label block text-sm font-medium text-gray-600 mb-1">Exit Date</label>
    <input type="date" class="input-sm" [(ngModel)]="formData.exitDate" name="exitDate">
  </div>

  <div>
    <label class="label block text-sm font-medium text-gray-600 mb-1">Email</label>
    <input class="input-sm" [(ngModel)]="formData.email" name="email">
  </div>



  <div>
    <label class="label block text-sm font-medium text-gray-600 mb-1">Password</label>
    <input type="password" class="input-sm" [(ngModel)]="formData.password" name="password">
  </div>

</div>


<!-- STEP 4 : DESIGNATION & SKILLS -->
<div *ngIf="currentStep === 4" class="space-y-6">
  
  <!-- Designation -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Designation</label>
    <input type="text" 
           [(ngModel)]="formData.portfolio.designation" 
           name="designation"
           class="w-full p-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500"
           placeholder="Enter your designation"
           required>
  </div>

  <div class="border-t border-gray-200 pt-4">
    <h5 class="text-lg font-medium text-gray-900 mb-3">Add Skills</h5>
    <div class="flex gap-2 mb-4">
    <input
      [(ngModel)]="newSkill"
      (keyup.enter)="addSkill()"
      name="skillInput"
      class="flex-1 p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      placeholder="Enter skill">
    <button
      type="button"
      (click)="addSkill()"
      class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
      Add
    </button>
  </div>

  <!-- Chips -->
  <div class="flex flex-wrap gap-2">
    <span
      *ngFor="let skill of formData.portfolio.skills"
      class="inline-flex items-center bg-blue-100 text-blue-800 text-sm font-medium px-2.5 py-0.5 rounded-full">
      {{ skill }}
      <button
        type="button"
        (click)="removeSkill(skill)"
        class="inline-flex items-center p-0.5 ms-2 text-blue-800 bg-transparent rounded-full hover:bg-blue-200"
        aria-label="Remove skill">
        <svg class="w-3.5 h-3.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
        </svg>
      </button>
    </span>
  </div>

  

</div>
</div>


<!-- STEP 4 : SKILLS -->


        </form>

        <!-- NAVIGATION -->
<div class="flex justify-between mt-6">

  <button *ngIf="currentStep > 1"
    (click)="prevStep()"
    class="px-4 py-2 bg-gray-300 rounded">
    ← Back
  </button>

  <div class="flex-1"></div>

          <button *ngIf="currentStep < 4"
            (click)="nextStep()"
            class="px-6 py-2 bg-green-600 text-white rounded">
            Next →
          </button>

          <button *ngIf="currentStep === 4"
            (click)="register()"
            class="px-6 py-2 bg-green-600 text-white rounded">
            Register
          </button>
        </div>

        <div class="text-center mt-4">
          <p class="text-sm text-gray-500">
            Already have an account?
            <button (click)="goToLogin()"
                    class="text-green-600 font-semibold">
              Login here
            </button>
          </p>
        </div>
